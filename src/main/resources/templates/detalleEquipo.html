<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Detalle del equipo')"></head>

<body>
<div th:replace="fragments :: navbar"></div>

<div class="container-fluid mt-3">
    <div class="row">
        <div class="col-md-8">
            <div th:if="${mensaje != null}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

            <div class="d-flex justify-content-between align-items-center">
                <h2 th:text="'Equipo: ' + ${equipo.nombre}">Equipo</h2>
                <div>
                    <a th:if="${usuario.admin}" class="btn btn-warning" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
                    <form th:if="${usuario.admin}" method="post" th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}" style="display:inline">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('¿Estás seguro de eliminar este equipo?')">Eliminar</button>
                    </form>
                    <form th:if="${!esMiembro}" method="post" th:action="@{/equipos/{id}/unirse(id=${equipo.id})}" style="display:inline">
                        <button type="submit" class="btn btn-success">Unirse al equipo</button>
                    </form>
                    <form th:if="${esMiembro}" method="post" th:action="@{/equipos/{id}/salir(id=${equipo.id})}" style="display:inline">
                        <button type="submit" class="btn btn-danger">Salir del equipo</button>
                    </form>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header font-weight-bold">
                    Participantes del equipo
                </div>
                <div class="card-body">
                    <table class="table table-striped" th:if="${not #lists.isEmpty(usuarios)}">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Correo electrónico</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="usuarioItem : ${usuarios}">
                            <td th:text="${usuarioItem.id}"></td>
                            <td th:text="${usuarioItem.nombre != null ? usuarioItem.nombre : 'No especificado'}"></td>
                            <td th:text="${usuarioItem.email}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <p class="text-muted" th:if="${#lists.isEmpty(usuarios)}">No hay usuarios en este equipo.</p>
                </div>
            </div>

            <div class="mt-3">
                <a class="btn btn-secondary" href="/equipos">Volver al listado</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
