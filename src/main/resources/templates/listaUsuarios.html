<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Listado de usuarios')"></head>

<body>
<div th:replace="fragments :: navbar"></div>

<div class="container-fluid mt-3">
    <div class="row">
        <div class="col">
            <h2>Listado de usuarios registrados</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Correo electrónico</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuarioItem : ${usuarios}">
                    <td th:text="${usuarioItem.id}"></td>
                    <td th:text="${usuarioItem.email}"></td>
                    <td th:text="${usuarioItem.bloqueado ? 'Bloqueado' : 'Activo'}"></td>
                    <td>
                        <a class="btn btn-primary btn-xs" th:href="@{/registrados/{id}(id=${usuarioItem.id})}">Detalles</a>
                        <form th:if="${!usuarioItem.bloqueado and (usuario == null or usuarioItem.id != usuario.id)}" method="post" th:action="@{/registrados/{id}/bloquear(id=${usuarioItem.id})}" style="display:inline">
                            <button type="submit" class="btn btn-danger btn-xs">Bloquear</button>
                        </form>
                        <form th:if="${usuarioItem.bloqueado and (usuario == null or usuarioItem.id != usuario.id)}" method="post" th:action="@{/registrados/{id}/desbloquear(id=${usuarioItem.id})}" style="display:inline">
                            <button type="submit" class="btn btn-success btn-xs">Habilitar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
