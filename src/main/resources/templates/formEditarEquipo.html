<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Editar Equipo')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid mt-3">

    <h2>Modificar equipo</h2>

    <div class="row mt-3">
        <div class="col-6">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form method="post" th:action="@{/equipos/{id}/editar(id=${equipoData.id})}" th:object="${equipoData}">
                <div class="form-group">
                    <label for="nombre">Nombre del equipo:</label>
                    <input class="form-control" id="nombre" name="nombre" required th:field="*{nombre}" type="text"/>
                </div>
                <button class="btn btn-primary" type="submit">Guardar cambios</button>
                <a class="btn btn-secondary" href="/equipos">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
